[package]
name = "fivem-doctor"
version = "0.1.0"
edition = "2024"
description = "Static analysis and quality checks for FiveM resources."
license = "MIT"
readme = "README.md"
repository = "https://github.com/r4gi-dev/fivem-doctor"
keywords = ["fivem", "lua", "static-analysis", "linter", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
full_moon = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"